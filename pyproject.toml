[project]
name = "Storefront-Research"
version = "1.0.0"
description = "Python web scraper for extracting structured product data from Turkish e-commerce platforms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "lxml>=6.1.2",
    "requests>=2.34.2",
]

[project.scripts]
scrape = "scrape:main"

[tool.ruff]
lint.ignore = ["F401", "BLE001"]

[tool.pyright]
reportMissingImports = false
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: hits external network (deselect with '-m not integration')",
]
addopts = "-m 'not integration' --tb=short"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scrape"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "pyright>=1.1.405",
    "urllib3>=2.7.0",
]
